name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stdlib-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - name: Pure-stdlib suites + API tests
        run: |
          pip install pytest
          fails=0
          for d in tokenforge weightsmith gradia ctxpack promptkit evalforge ragshield agentcore; do
            echo "== $d =="
            (cd "$d" && python -m pytest -q) || fails=1
          done
          python -m pytest tests -q || fails=1
          exit $fails
