name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  stdlib-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pytest fastapi httpx pyyaml
      - name: Run all suites
        run: |
          set -e
          for d in tokenforge weightsmith gradia ctxpack promptkit evalforge ragshield agentcore; do
            echo "== $d =="
            (cd "projects/$d" && python -m pytest -q)
          done
          echo "== margin API tests =="
          PYTHONPATH=projects python -m pytest tests -q
